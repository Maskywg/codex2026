<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投手球路圖鑑 — Pitcher's Arsenal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;700&family=Oswald:wght@300;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d14;
    --panel: #10141f;
    --border: #1e2535;
    --accent: #e8c84a;
    --accent2: #e05a2b;
    --accent3: #4ab8e8;
    --text: #d4dde8;
    --muted: #5a6880;
    --grass: #1a3a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  header {
    text-align: center;
    padding: 60px 20px 40px;
    background: #0a0d14;
  }
  .hero-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 6px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 10vw, 100px);
    letter-spacing: 4px;
    line-height: 0.9;
    color: #ffffff;
    text-shadow: 0 0 40px rgba(232,200,74,0.5);
  }
  .hero-sub {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 8px;
    color: var(--muted);
    margin-top: 8px;
    position: relative;
  }

  /* ── NAV PILLS ── */
  .nav-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 0 20px 36px;
    max-width: 900px;
    margin: 0 auto;
  }
  .nav-pill {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 6px 16px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .25s;
  }
  .nav-pill:hover, .nav-pill.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  /* ── MAIN LAYOUT ── */
  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* ── PITCH CARD ── */
  .pitch-card {
    display: none;
    animation: fadeIn .4s ease;
  }
  .pitch-card.active { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 700px) { .pitch-card.active { grid-template-columns: 1fr; } }

  @keyframes fadeIn {
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .info-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }
  .info-panel::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--accent);
  }

  .pitch-name-en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 3px;
    color: #fff;
    line-height: 1;
  }
  .pitch-name-zh {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--accent);
    margin-top: 4px;
  }
  .abbr-badge {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 3px 10px;
    border: 1px solid var(--accent2);
    color: var(--accent2);
    margin-top: 6px;
  }

  .pitch-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    padding: 12px;
    text-align: center;
  }
  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--accent3);
  }
  .stat-lbl {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-top: 2px;
  }

  .pitch-desc {
    font-size: 14px;
    line-height: 1.9;
    color: #9aaabb;
  }

  .grip-section h4 {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* ── CANVAS PANEL ── */
  .canvas-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .canvas-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .ctab {
    flex: 1;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 14px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: transparent;
    transition: all .2s;
    border-bottom: 2px solid transparent;
  }
  .ctab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .canvas-area {
    flex: 1;
    position: relative;
    min-height: 340px;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .ctrl-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }
  .btn-play {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 8px 20px;
    background: var(--accent);
    color: #000;
    border: none;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn-play:hover { opacity: .8; }
  .speed-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
  }
  input[type=range] {
    accent-color: var(--accent);
    width: 80px;
  }

  /* ── GRIP SVG ── */
  .grip-wrap {
    display: flex;
    justify-content: center;
    margin-top: 4px;
  }
  .grip-wrap svg { max-width: 160px; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 24px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="hero-tag">⚾ Pitcher's Arsenal</div>
  <h1>球路圖鑑</h1>
  <div class="hero-sub">Interactive Pitch Encyclopedia</div>
</header>

<nav class="nav-bar" id="navBar"></nav>

<main class="main" id="cardContainer"></main>

<footer>製作人：Masky Wang &nbsp;·&nbsp; Baseball Pitch Guide</footer>

// ─── BUILD NAV ────────────────────────────────────────────────
const navBar = document.getElementById('navBar');
const container = document.getElementById('cardContainer');

pitches.forEach((p, i) => {
  const pill = document.createElement('button');
  pill.className = 'nav-pill' + (i === 0 ? ' active' : '');
  pill.textContent = p.zh.split(' ')[0];
  pill.dataset.id = p.id;
  pill.addEventListener('click', () => switchPitch(p.id));
  navBar.appendChild(pill);
});

// ─── BUILD CARDS ──────────────────────────────────────────────

// ─── GRIP SVG BUILDER ─────────────────────────────────────────
function buildGripSVG(p) {
  // Baseball circle with finger placement indicators
  const configs = {

    twoseam:   { fingers: [[75,42],[85,42]], seams: 'vert', thumb: [80,95] },
    curveball: { fingers: [[80,40],[80,40]], seams: 'curve', thumb: [80,95] },
    slider:    { fingers: [[85,38],[95,38]], seams: 'side', thumb: [75,95] },
    changeup:  { fingers: [[65,45],[75,45],[85,45]], seams: 'circle', thumb: [75,95] },
    splitter:  { fingers: [[62,40],[98,40]], seams: 'split', thumb: [80,95] },
    cutter:    { fingers: [[82,38],[92,38]], seams: 'cut', thumb: [75,95] },
    sinker:    { fingers: [[75,42],[85,42]], seams: 'sink', thumb: [80,95] },
    knuckleball: { fingers: [[72,38],[88,38]], seams: 'knuckle', thumb: [80,95] },
    sweeper:     { fingers: [[88,36],[98,36]], seams: 'side', thumb: [72,95] },
    slurve:      { fingers: [[82,38],[82,38]], seams: 'slurve', thumb: [80,95] },
    screwball:   { fingers: [[72,40],[72,40]], seams: 'screw', thumb: [88,95] },
    gyroball:    { fingers: [[75,38],[85,38]], seams: 'cross', thumb: [80,95] },
    eephus:      { fingers: [[74,38],[86,38]], seams: 'curve', thumb: [80,95] },
  };
  const cfg = configs[p.id] || configs.fastball;
  const c = p.color;

  // seam paths
  const seamMap = {
    cross:  `<path d="M60,65 Q80,50 100,65" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>
             <path d="M60,75 Q80,60 100,75" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>
             <path d="M72,50 Q80,70 72,90" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>
             <path d="M88,50 Q80,70 88,90" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>`,
    vert:   `<path d="M72,48 Q68,70 72,92" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>
             <path d="M88,48 Q92,70 88,92" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>`,
    curve:  `<path d="M58,60 Q80,45 102,60" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>
             <path d="M58,80 Q80,95 102,80" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>`,
    side:   `<path d="M60,58 Q80,52 100,58" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>
             <path d="M60,70 Q80,64 100,70" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>`,
    circle: `<circle cx="80" cy="70" r="16" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>
             <path d="M60,62 Q80,55 100,62" stroke="${c}" stroke-width="1.5" fill="none" opacity=".5"/>`,
    split:  `<path d="M62,50 Q62,70 62,90" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>
             <path d="M98,50 Q98,70 98,90" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>
             <path d="M60,70 Q80,65 100,70" stroke="${c}" stroke-width="1.5" fill="none" opacity=".5"/>`,
    cut:    `<path d="M60,65 Q80,50 100,65" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>
             <path d="M60,75 Q80,60 100,75" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>
             <path d="M90,48 Q86,70 90,92" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>`,
    sink:   `<path d="M72,52 Q70,70 74,90" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>
             <path d="M88,52 Q90,70 86,90" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>`,
    knuckle: `<path d="M60,65 Q80,50 100,65" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>
              <path d="M60,75 Q80,90 100,75" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>
              <text x="80" y="73" text-anchor="middle" font-size="9" fill="${c}" opacity=".8" font-family="sans-serif">爪</text>`,
    slurve: `<path d="M58,60 Q80,48 102,60" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>
             <path d="M88,50 Q84,70 88,92" stroke="${c}" stroke-width="1.5" fill="none" opacity=".6"/>`,
    screw:  `<path d="M58,60 Q80,45 102,60" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>
             <path d="M58,80 Q80,95 102,80" stroke="${c}" stroke-width="2" fill="none" opacity=".7"/>
             <text x="80" y="73" text-anchor="middle" font-size="8" fill="${c}" opacity=".7" font-family="sans-serif">↺</text>`,
  };

  const fingerDots = cfg.fingers.map(([x,y]) =>
    `<ellipse cx="${x}" cy="${y}" rx="7" ry="5" fill="${c}" opacity=".85"/>
     <ellipse cx="${x}" cy="${y}" rx="5" ry="3.5" fill="rgba(255,255,255,0.3)"/>`
  ).join('');

  const thumbDot = `<ellipse cx="${cfg.thumb[0]}" cy="${cfg.thumb[1]}" rx="7" ry="5" fill="${c}" opacity=".6"/>`;

  return `<svg viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">
    <!-- ball -->
    <circle cx="80" cy="70" r="38" fill="#c8b07a" opacity=".15" stroke="${c}" stroke-width="1"/>
    <circle cx="80" cy="70" r="38" fill="url(#ballgrad)"/>
    <defs>
      <radialGradient id="ballgrad" cx="40%" cy="35%">
        <stop offset="0%" stop-color="#f0e8d0"/>
        <stop offset="100%" stop-color="#c8b07a"/>
      </radialGradient>
    </defs>
    <!-- seams -->
    ${seamMap[cfg.seams] || ''}
    <!-- fingers -->
    ${fingerDots}
    ${thumbDot}
    <!-- labels -->
    <text x="80" y="128" text-anchor="middle" font-size="8" fill="#5a6880" font-family="sans-serif" letter-spacing="1">拇指 ▲</text>
  </svg>`;
}

// ─── CANVAS ANIMATION ENGINE ──────────────────────────────────
const animStates = {};

function getCanvasSize(cv) {
  const rect = cv.parentElement.getBoundingClientRect();
  return { w: rect.width || 480, h: rect.height || 340 };
}

function initCanvas(pid) {
  const cv = document.getElementById('cv-' + pid);
  if (!cv || animStates[pid]) return;
  const { w, h } = getCanvasSize(cv);
  cv.width = w; cv.height = h;
  animStates[pid] = { view: 'side', speed: 1, t: 0, playing: false, raf: null };
  drawFrame(pid);
}

function switchView(pid, view) {
  if (!animStates[pid]) return;
  animStates[pid].view = view;
  animStates[pid].t = 0;
  animStates[pid].playing = false;
  cancelAnimationFrame(animStates[pid].raf);
  drawFrame(pid);
}

// Trajectory definitions per pitch
const trajectories = {
  fastball:  { side: { curve: 0.05, sideMove: 0 },    top: { curve: 0.02 }, break: 'straight', color: '#e8c84a' },
  twoseam:   { side: { curve: 0.12, sideMove: 0.1 },  top: { curve: 0.12 }, break: 'tail-in',  color: '#e8a02b' },
  curveball: { side: { curve: 0.18, sideMove: 0 },    top: { curve: 0.05 }, break: 'drop',     color: '#4ab8e8' },
  slider:    { side: { curve: 0.15, sideMove: 0.25 }, top: { curve: 0.28 }, break: 'sweep',    color: '#a04ae8' },
  changeup:  { side: { curve: 0.18, sideMove: 0.08 }, top: { curve: 0.06 }, break: 'fade',     color: '#4ae882' },
  splitter:  { side: { curve: 0.16, sideMove: 0 },    top: { curve: 0.02 }, break: 'dive',     color: '#e84a4a' },
  cutter:    { side: { curve: 0.08, sideMove: 0.14 }, top: { curve: 0.14 }, break: 'cut',      color: '#e8824a' },
  sinker:    { side: { curve: 0.14, sideMove: 0.12 }, top: { curve: 0.1  }, break: 'sink',     color: '#4ae8c8' },
  knuckleball: { side: { curve: 0.1,  sideMove: 0    }, top: { curve: 0.05 }, break: 'random',   color: '#ff9ef5', knuckle: true },
  sweeper:     { side: { curve: 0.10, sideMove: 0.38 }, top: { curve: 0.38 }, break: 'sweep-big', color: '#ff6b9d' },
  slurve:      { side: { curve: 0.22, sideMove: 0.18 }, top: { curve: 0.18 }, break: 'slurve',    color: '#c084fc' },
  screwball:   { side: { curve: 0.15, sideMove: -0.20}, top: { curve: 0.20 }, break: 'reverse',   color: '#fb923c' },
  gyroball:    { side: { curve: 0.04, sideMove: 0    }, top: { curve: 0.01 }, break: 'none',      color: '#67e8f9' },
  eephus:      { side: { curve: 0.13, sideMove: 0    }, top: { curve: 0.02 }, break: 'lob',       color: '#fde68a', eephus: true },
};

// ─── 共用物理座標系 ─────────────────────────────────────────
// 側面視角的真實世界 Y 座標（canvas 像素）
// ground = h*0.78, strikeZone top ~ h*0.58, bottom ~ h*0.72
// 球出手高度 = h*0.55（投手肩膀高度），終點落在好球帶內
function calcDropY(frac, c, pid, h) {
  if (pid === 'eephus') {
    // 拋物線：先拋高再落下，最高點在 frac=0.45 時
    const arc = -Math.sin(frac * Math.PI) * 0.22 * h; // 向上弧
    const drop = c * h * frac * frac;
    return h * 0.55 + arc + drop;
  }
  const dropPow = (pid==='splitter'||pid==='sinker') ? frac*frac*frac : frac*frac;
  return h * 0.55 + c * h * dropPow;
}
// 側面視角：球的最終 Y（frac=1 時）
// 打者視角用同一個值換算到好球帶框內的相對位置
function finalDropRatio(c, pid) {
  // 回傳 frac=1 時 dropY / h，讓打者視角可以對齊
  const dropPow = (pid==='splitter'||pid==='sinker') ? 1 : 1;
  return c * dropPow; // c 就是最大下墜比例
}

function drawFrame(pid) {
  const cv = document.getElementById('cv-' + pid);
  if (!cv) return;
  const { w, h } = getCanvasSize(cv);
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const st = animStates[pid];
  const traj = trajectories[pid] || trajectories.fastball;
  const t = st ? st.t : 0;
  const view = st ? st.view : 'side';

  ctx.clearRect(0, 0, w, h);

  // background
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#0a0d14');
  grad.addColorStop(1, '#0f1420');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  if (view === 'side') drawSideView(ctx, w, h, t, traj, pid);
  else if (view === 'top') drawTopView(ctx, w, h, t, traj, pid);
  else drawHomeView(ctx, w, h, t, traj, pid);
}

function drawSideView(ctx, w, h, t, traj, pid) {
  const col = traj.color;
  // Ground line
  ctx.strokeStyle = '#1a3a1a';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(0, h*0.78); ctx.lineTo(w, h*0.78); ctx.stroke();
  ctx.setLineDash([]);

  // Strike zone rect
  const szX = w*0.88, szW = 40, szH = 60, szY = h*0.78 - szH - 30;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(szX - szW/2, szY, szW, szH);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fillRect(szX - szW/2, szY, szW, szH);
  ctx.fillStyle = '#3a3a4a';
  ctx.font = '9px Oswald';
  ctx.fillText('STRIKE ZONE', szX - 24, szY + szH + 14);

  // Pitcher mound
  ctx.fillStyle = '#2a2010';
  ctx.beginPath();
  ctx.ellipse(w*0.1, h*0.78, 28, 6, 0, 0, Math.PI*2);
  ctx.fill();

  // Labels
  ctx.fillStyle = '#3a4555';
  ctx.font = '9px Oswald';
  ctx.fillText('PITCHER', w*0.04, h*0.84);
  ctx.fillText('HOME PLATE', w*0.82, h*0.84);

  // Trail
  const steps = 60;
  const c = traj.side.curve;
  const sm = traj.side.sideMove;
  const isKnuckle = !!traj.knuckle;

  // knuckleball: pre-generate wobble offsets (seeded by pid for consistency per session)
  function knuckleOffset(frac, axis) {
    // Use multiple sine waves at different frequencies to simulate chaotic drift
    const seed = pid.length * 7;
    if (axis === 'y') {
      return Math.sin(frac * 18 + seed) * 0.012 * h
           + Math.sin(frac * 31 + seed * 2) * 0.006 * h
           + Math.sin(frac * 47) * 0.004 * h;
    } else {
      return Math.sin(frac * 22 + seed * 3) * 0.010 * w
           + Math.sin(frac * 13 + seed) * 0.005 * w;
    }
  }

  ctx.lineWidth = 1;
  for (let i = 0; i < steps * t; i++) {
    const frac = i / steps;
    const sideX = w * (0.12 + frac * 0.78) + sm * w * 0.08 * frac * frac;
    const x = sideX + (isKnuckle ? knuckleOffset(frac,'x') : 0);
    const y = calcDropY(frac, c, pid, h) + (isKnuckle ? knuckleOffset(frac,'y') : 0);
    const alpha = 0.06 + frac * 0.04;
    ctx.fillStyle = `rgba(${hexToRgb(col)}, ${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, 3 + frac*2, 0, Math.PI*2); ctx.fill();
  }

  // Ball
  if (t > 0) {
    const frac = Math.min(t, 1);
    const sideX = w * (0.12 + frac * 0.78) + sm * w * 0.08 * frac * frac;
    const x = sideX + (isKnuckle ? knuckleOffset(frac,'x') : 0);
    const y = calcDropY(frac, c, pid, h) + (isKnuckle ? knuckleOffset(frac,'y') : 0);

    // glow
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 18);
    glow.addColorStop(0, col + '66');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI*2); ctx.fill();

    // ball
    const ballG = ctx.createRadialGradient(x-3, y-3, 1, x, y, 10);
    ballG.addColorStop(0, '#fff');
    ballG.addColorStop(0.4, '#f0e8d0');
    ballG.addColorStop(1, '#c8b07a');
    ctx.fillStyle = ballG;
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // spin lines
    ctx.strokeStyle = col + '88';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, 7, Date.now()*0.01, Date.now()*0.01 + Math.PI);
    ctx.stroke();
  }

  // Speed indicator
  const pitch = pitches.find(p => p.id === pid);
  if (pitch) {
    ctx.fillStyle = col;
    ctx.font = 'bold 11px Oswald';
    ctx.letterSpacing = '2px';
    ctx.fillText(pitch.speed + ' km/h', 16, 24);
    ctx.fillStyle = '#3a4555';
    ctx.font = '9px Oswald';
    ctx.fillText('VELOCITY RANGE', 16, 36);
  }
}

function drawTopView(ctx, w, h, t, traj, pid) {
  const col = traj.color;
  // Field lines
  ctx.strokeStyle = '#1a3a1a';
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(w/2, h*0.85); ctx.lineTo(w/2, h*0.05); ctx.stroke();
  ctx.setLineDash([]);

  // Home plate
  ctx.fillStyle = '#ccc';
  ctx.beginPath();
  ctx.moveTo(w/2, h*0.85); ctx.lineTo(w/2-14,h*0.78); ctx.lineTo(w/2-14,h*0.72);
  ctx.lineTo(w/2+14,h*0.72); ctx.lineTo(w/2+14,h*0.78); ctx.closePath();
  ctx.fill();

  const sm = traj.side.sideMove;

  // Trail
  for (let i = 0; i < 60 * t; i++) {
    const frac = i / 60;
    const y = h * (0.82 - frac * 0.75);
    const xDrift = sm * w * 0.18 * frac * frac;
    const x = w/2 + xDrift;
    const alpha = 0.05 + frac * 0.04;
    ctx.fillStyle = `rgba(${hexToRgb(col)}, ${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, 3+frac*2, 0, Math.PI*2); ctx.fill();
  }

  if (t > 0) {
    const frac = Math.min(t, 1);
    const y = h * (0.82 - frac * 0.75);
    const xDrift = sm * w * 0.18 * frac * frac;
    const x = w/2 + xDrift;

    const glow = ctx.createRadialGradient(x,y,0,x,y,18);
    glow.addColorStop(0, col+'55'); glow.addColorStop(1,'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x,y,18,0,Math.PI*2); ctx.fill();

    const bg = ctx.createRadialGradient(x-3,y-3,1,x,y,10);
    bg.addColorStop(0,'#fff'); bg.addColorStop(1,'#c8b07a');
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();
  }

  ctx.fillStyle='#3a4555'; ctx.font='9px Oswald';
  ctx.textAlign='center';
  ctx.fillText('TOP VIEW — 俯視視角', w/2, h-12);
  ctx.textAlign='left';
}

function drawHomeView(ctx, w, h, t, traj, pid) {
  const col = traj.color;
  const c = traj.side.curve;   // 下墜量 (正值 = 向下)
  const sm = traj.side.sideMove; // 側移量 (正值 = 往右)

  // 打者視角：球從投手方向（畫面中央偏上、小）飛向本壘板（畫面下方中央、大）
  // frac=0 → 球在遠處（畫面上方中間）
  // frac=1 → 球抵達好球帶（畫面中下方）

  const szX = w/2;
  // 好球帶：畫面中央偏下
  const szY = h * 0.32, szW = 130, szH = 95;

  // Ground
  ctx.fillStyle='rgba(26,58,26,0.3)';
  ctx.fillRect(0, h*0.72, w, h*0.28);

  // Home plate
  ctx.fillStyle='#ddd';
  ctx.beginPath();
  ctx.moveTo(w/2, h*0.80); ctx.lineTo(w/2-24, h*0.75); ctx.lineTo(w/2-24, h*0.71);
  ctx.lineTo(w/2+24, h*0.71); ctx.lineTo(w/2+24, h*0.75); ctx.closePath();
  ctx.fill();

  // Strike zone
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1.5;
  ctx.strokeRect(szX-szW/2, szY, szW, szH);
  for(let i=1;i<3;i++){
    ctx.beginPath(); ctx.moveTo(szX-szW/2, szY+szH/3*i); ctx.lineTo(szX+szW/2, szY+szH/3*i); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(szX-szW/2+szW/3*i, szY); ctx.lineTo(szX-szW/2+szW/3*i, szY+szH); ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,0.03)';
  ctx.fillRect(szX-szW/2, szY, szW, szH);
  ctx.fillStyle='#3a4555'; ctx.font='9px Oswald'; ctx.textAlign='center';
  ctx.fillText('好球帶 STRIKE ZONE', szX, szY - 8);

  if (t > 0) {
    const frac = Math.min(t, 1);

    // 起點（遠處）：畫面正中央上方
    const startX = w / 2;
    const startY = traj.eephus ? h * 0.05 : h * 0.12;

    // 終點（本壘板前）：好球帶中心 + 側移 + 下墜
    // 側移：sm 正值往右（從打者角度，右投右打者會感受到球往外角跑）
    const endX = szX + sm * szW * 0.55; // sm 負值(screwball)自動往左
    // 下墜：與側面視角對齊
    // 側面 baseY=h*0.55（無下墜）→ 打者視角好球帶中上 szY+szH*0.2
    // 側面 ground h*0.72（最大下墜）→ 打者視角好球帶底 szY+szH*0.95
    const sideBaseY = 0.55;   // h 的比例
    const sideGndY  = 0.72;
    const sideFinalY = sideBaseY + c; // frac=1, dropPow=1
    const t01 = Math.min(1, Math.max(0, (sideFinalY - sideBaseY) / (sideGndY - sideBaseY)));
    const endY = szY + szH * (0.15 + t01 * 0.75);

    // 目前球的位置（線性插值）
    const isKnuckleH = !!traj.knuckle;
    const seed = pid.length * 7;
    const wobX = isKnuckleH ? (Math.sin(frac*22+seed*3)*0.012*w + Math.sin(frac*13+seed)*0.006*w) : 0;
    const wobY = isKnuckleH ? (Math.sin(frac*18+seed)*0.012*h + Math.sin(frac*31+seed*2)*0.006*h) : 0;
    const ballX = startX + (endX - startX) * frac + wobX;
    const ballY = startY + (endY - startY) * frac + wobY;

    // 球越近越大（透視感）
    const ballSize = 3 + frac * 16;

    // 軌跡尾巴
    for (let i = 0; i < 30 * frac; i++) {
      const tf = i / 30;
      const tx = startX + (endX - startX) * tf;
      const ty = startY + (endY - startY) * tf;
      const ts = 2 + tf * 14;
      ctx.fillStyle = `rgba(${hexToRgb(col)}, ${0.04 + tf * 0.05})`;
      ctx.beginPath(); ctx.arc(tx, ty, ts, 0, Math.PI*2); ctx.fill();
    }

    const glow = ctx.createRadialGradient(ballX,ballY,0,ballX,ballY,ballSize*2.5);
    glow.addColorStop(0,col+'66'); glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(ballX,ballY,ballSize*2.5,0,Math.PI*2); ctx.fill();

    const bg = ctx.createRadialGradient(ballX-ballSize*0.3,ballY-ballSize*0.3,1,ballX,ballY,ballSize);
    bg.addColorStop(0,'#fff'); bg.addColorStop(1,'#c8b07a');
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.arc(ballX,ballY,ballSize,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.textAlign='left';
}

// ─── PITCH SOUND ──────────────────────────────────────────────
let audioCtx = null;
const pitchAudioCache = new Map();

function getAudioContext() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return null;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function parseAverageSpeed(speedText) {
  const nums = (speedText.match(/\d+/g) || []).map(Number);
  if (!nums.length) return 130;
  return nums.reduce((sum, n) => sum + n, 0) / nums.length;
}

function getPitchSoundProfile(pid) {
  const pitch = pitches.find(p => p.id === pid) || pitches[0];
  const traj = trajectories[pid] || trajectories.fastball;
  const averageSpeed = parseAverageSpeed(pitch.speed);
  const speedFactor = Math.max(0, Math.min(1, (averageSpeed - 100) / 65));
  const travelTime = 0.46 - speedFactor * 0.16 + (traj.eephus ? 0.22 : 0);
  return { speedFactor, travelTime };
}

function encodeWav(samples, sampleRate) {
  const dataBytes = samples.length * 2;
  const buffer = new ArrayBuffer(44 + dataBytes);
  const view = new DataView(buffer);

  function writeString(offset, value) {
    for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataBytes, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataBytes, true);

  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }

  let binary = '';
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return `data:audio/wav;base64,${btoa(binary)}`;
}

function makePitchAudioElement(pid) {
  if (pitchAudioCache.has(pid)) return pitchAudioCache.get(pid);

  const sampleRate = 44100;
  const { speedFactor, travelTime } = getPitchSoundProfile(pid);
  const duration = travelTime + 0.22;
  const length = Math.floor(sampleRate * duration);
  const samples = new Float32Array(length);
  const whooshFreq = 180 + speedFactor * 180;
  const popFreq = 90 + speedFactor * 45;

  for (let i = 0; i < length; i++) {
    const t = i / sampleRate;
    let sample = 0;

    if (t < travelTime) {
      const progress = t / travelTime;
      const env = Math.sin(progress * Math.PI) * (0.22 + speedFactor * 0.16);
      const noise = (Math.random() * 2 - 1) * env;
      const hum = Math.sin(Math.PI * 2 * (whooshFreq + progress * 180) * t) * env * 0.28;
      sample += noise * 0.55 + hum;
    }

    if (t >= travelTime) {
      const popT = t - travelTime;
      const env = Math.exp(-popT * 38) * (0.78 + speedFactor * 0.18);
      const slap = (Math.random() * 2 - 1) * env * 0.72;
      const thump = Math.sin(Math.PI * 2 * popFreq * popT) * env * 0.48;
      sample += slap + thump;
    }

    samples[i] = sample * 0.72;
  }

  const audio = new Audio(encodeWav(samples, sampleRate));
  audio.preload = 'auto';
  audio.volume = 1;
  pitchAudioCache.set(pid, audio);
  return audio;
}

function playHtmlAudioPitchSound(pid) {
  const baseAudio = makePitchAudioElement(pid);
  const audio = baseAudio.cloneNode();
  audio.volume = 1;
  audio.currentTime = 0;
  audio.playbackRate = 1;
  return audio.play();
}

function makeNoiseBuffer(ctx, duration) {
  const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
  return buffer;
}

function playNoise(ctx, start, duration, gainValue, filterType, frequency) {
  const source = ctx.createBufferSource();
  const filter = ctx.createBiquadFilter();
  const gain = ctx.createGain();

  source.buffer = makeNoiseBuffer(ctx, duration);
  filter.type = filterType;
  filter.frequency.setValueAtTime(frequency, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(gainValue, start + 0.025);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  source.start(start);
  source.stop(start + duration + 0.02);
}

function playTone(ctx, start, frequency, duration, gainValue, type = 'sine') {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(frequency, start);
  osc.frequency.exponentialRampToValueAtTime(Math.max(40, frequency * 0.62), start + duration);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(gainValue, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + duration + 0.02);
}

function playWebAudioPitchSound(pid) {
  const ctx = getAudioContext();
  if (!ctx) return;

  const { speedFactor, travelTime } = getPitchSoundProfile(pid);
  const now = ctx.currentTime + 0.015;

  playNoise(ctx, now, travelTime, 0.035 + speedFactor * 0.035, 'highpass', 420 + speedFactor * 900);
  playTone(ctx, now + 0.02, 150 + speedFactor * 95, travelTime * 0.72, 0.018, 'triangle');
  playNoise(ctx, now + travelTime, 0.075, 0.16 + speedFactor * 0.06, 'bandpass', 950 + speedFactor * 700);
  playTone(ctx, now + travelTime, 90 + speedFactor * 35, 0.09, 0.09, 'sine');
}

function playPitchSound(pid) {
  const playPromise = playHtmlAudioPitchSound(pid);
  if (playPromise && typeof playPromise.catch === 'function') {
    playPromise.catch(() => playWebAudioPitchSound(pid));
  }
}

// ─── ANIMATION LOOP ───────────────────────────────────────────
function animate(pid) {
  const st = animStates[pid];
  if (!st || !st.playing) return;
  st.t += 0.012 * st.speed;
  drawFrame(pid);
  if (st.t < 1.05) {
    st.raf = requestAnimationFrame(() => animate(pid));
  } else {
    st.t = 1;
    st.playing = false;
    drawFrame(pid);
  }
}

// ─── EVENT DELEGATION ─────────────────────────────────────────
document.addEventListener('click', e => {
  const pill = e.target.closest('.nav-pill');
  if (pill) { switchPitch(pill.dataset.id); return; }

  const ctab = e.target.closest('.ctab');
  if (ctab) {
    const pid = ctab.dataset.card;
    document.querySelectorAll(`.ctab[data-card="${pid}"]`).forEach(t => t.classList.remove('active'));
    ctab.classList.add('active');
    switchView(pid, ctab.dataset.view);
    return;
  }

  const btn = e.target.closest('.btn-play');
  if (btn) {
    const pid = btn.dataset.card;
    if (!animStates[pid]) initCanvas(pid);
    const st = animStates[pid];
    st.t = 0;
    st.playing = true;
    playPitchSound(pid);
    animate(pid);
    return;
  }
});

document.addEventListener('input', e => {
  const slider = e.target.closest('.speed-slider');
  if (slider) {
    const pid = slider.dataset.card;
    if (animStates[pid]) animStates[pid].speed = parseFloat(slider.value);
    const lbl = document.getElementById('spd-' + pid);
    if (lbl) lbl.textContent = '×' + parseFloat(slider.value).toFixed(1);
  }
});

function switchPitch(id) {
  document.querySelectorAll('.nav-pill').forEach(p => p.classList.toggle('active', p.dataset.id === id));
  document.querySelectorAll('.pitch-card').forEach(c => c.classList.toggle('active', c.id === 'card-' + id));
  if (!animStates[id]) { setTimeout(() => initCanvas(id), 50); }
  else { setTimeout(() => drawFrame(id), 50); }
}

// ─── HELPERS ──────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

// ─── INIT ─────────────────────────────────────────────────────
window.addEventListener('load', () => {
  setTimeout(() => initCanvas('fastball'), 100);
});
window.addEventListener('resize', () => {
  const active = document.querySelector('.pitch-card.active');
  if (active) {
    const pid = active.id.replace('card-','');
    drawFrame(pid);
  }
});
</script>
